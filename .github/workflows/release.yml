name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            macos_deployment_target: '10.13'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set macOS deployment target
        if: matrix.macos_deployment_target
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: crates/amanuensis-gui/ui
        run: npm ci

      - name: Build frontend
        working-directory: crates/amanuensis-gui/ui
        run: npm run build

      - name: Prepare App Store Connect API key
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: crates/amanuensis-gui
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: Amanuensis ${{ github.ref_name }}
          releaseBody: |
            | File | Platform |
            |------|----------|
            | `Amanuensis_*_aarch64.dmg` | macOS Apple Silicon |
            | `Amanuensis_*_x64.dmg` | macOS Intel (10.13+) |
            | `Amanuensis_*_amd64.deb` | Linux x64 (Debian/Ubuntu) |
            | `Amanuensis_*_amd64.AppImage` | Linux x64 (portable) |
            | `Amanuensis-*.x86_64.rpm` | Linux x64 (Fedora/RHEL) |
            | `Amanuensis_*_x64-setup.exe` | Windows x64 (installer) |
            | `Amanuensis_*_en-US.msi` | Windows x64 (MSI) |
            | `Amanuensis_portable_x64.zip` | Windows x64 (portable) |
          releaseDraft: false
          prerelease: true

      - name: Verify notarization and upload macOS app tarball
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          APP_PATH="$BUNDLE_DIR/macos/Amanuensis.app"

          codesign -vv --deep --strict "$APP_PATH"
          spctl -a -vv -t exec "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            ARCH="aarch64"
          else
            ARCH="x64"
          fi

          tar czf "Amanuensis_${ARCH}.app.tar.gz" -C "$BUNDLE_DIR/macos" "Amanuensis.app"
          gh release upload ${{ github.ref_name }} "Amanuensis_${ARCH}.app.tar.gz" --clobber

      - name: Create portable Windows zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/amanuensis-gui.exe" "Amanuensis.exe"
          Compress-Archive -Path "Amanuensis.exe" -DestinationPath "Amanuensis_portable_x64.zip"

      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} Amanuensis_portable_x64.zip --clobber
